name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -c deploy/constraints.txt pytest pytest-asyncio ruff redis kafka-python-ng pandas yfinance
          pip install -c deploy/constraints.txt -r api/requirements.txt
          pip install -c deploy/constraints.txt -r gatekeeper/requirements.txt
          pip install -c deploy/constraints.txt -r ai_layer/requirements.txt
          pip install -c deploy/constraints.txt -r hunters/requirements.txt
          pip install -c deploy/constraints.txt -r executor/requirements.txt
          pip install -c deploy/constraints.txt -r persistence/requirements.txt -r resolver/requirements.txt -r notifier/requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests
        run: PYTHONPATH=. python -m pytest -q --tb=short

      - name: Shell syntax
        run: find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n

  frontend-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_required: ${{ steps.release-changes.outputs.required }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release paths
        id: release-changes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        env:
          CI_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        # A successful main run either published or had nothing to publish, so it is a safe
        # base. The previous push is not: its CI may have failed before publishing.
        run: |
          base=""
          if [[ "$CI_EVENT" != "workflow_dispatch" ]]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Release base unavailable; publishing."
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" -- \
            .github/workflows/ci.yml .github/workflows/public-demo.yml \
            frontend deploy api ai_layer gatekeeper hunters persistence resolver engine .dockerignore)
          echo "Release base $base; changed release paths: ${changed:-none}"
          if [[ -n "$changed" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      - name: Frontend build
        run: npm run build
      - name: Public static build
        run: npm run build:public

      - name: Save verified public site
        if: steps.release-changes.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: frontend/public-site/out
          if-no-files-found: error
          retention-days: 1

  engine-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run engine tests
        run: mvn -B test

  publish:
    needs: [python-lint-and-test, frontend-ci, engine-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.frontend-ci.outputs.release_required == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/public-demo.yml
